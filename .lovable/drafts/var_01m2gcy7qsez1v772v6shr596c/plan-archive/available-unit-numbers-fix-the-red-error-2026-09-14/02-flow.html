<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: var(--fg-secondary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .acc { fill: var(--bg-accent-translucent); stroke: var(--fg-accent); stroke-width: 1; }
    .accink { fill: var(--fg-accent); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--fg-secondary)"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="30" width="180" height="52" rx="8"/>
  <text class="lbl" x="106" y="52" text-anchor="middle">Onboarding Pipeline</text>
  <text class="sm" x="106" y="70" text-anchor="middle">Stage 5 unit number</text>

  <rect class="box" x="16" y="112" width="180" height="52" rx="8"/>
  <text class="lbl" x="106" y="134" text-anchor="middle">Vehicle Hub</text>
  <text class="sm" x="106" y="152" text-anchor="middle">Unit Numbers dialog</text>

  <line class="wire" x1="196" y1="56" x2="256" y2="88" marker-end="url(#a)"/>
  <line class="wire" x1="196" y1="138" x2="256" y2="106" marker-end="url(#a)"/>

  <rect class="acc" x="260" y="70" width="180" height="54" rx="8"/>
  <text class="lbl accink" x="350" y="92" text-anchor="middle">Available numbers</text>
  <text class="sm accink" x="350" y="110" text-anchor="middle">read-only routine</text>

  <rect class="zone" x="248" y="150" width="376" height="126" rx="8"/>
  <text class="sm" x="262" y="170">inside the routine</text>

  <rect class="box" x="264" y="184" width="150" height="44" rx="8"/>
  <text class="lbl" x="339" y="204" text-anchor="middle">scratch table</text>
  <text class="sm" x="339" y="220" text-anchor="middle">refused — today</text>

  <line class="wire" x1="424" y1="206" x2="464" y2="206" marker-end="url(#a)"/>

  <rect class="box" x="468" y="184" width="144" height="44" rx="8"/>
  <text class="lbl" x="540" y="204" text-anchor="middle">inline sub-queries</text>
  <text class="sm" x="540" y="220" text-anchor="middle">the change</text>

  <line class="wire" x1="350" y1="124" x2="350" y2="182" marker-end="url(#a)"/>

  <circle class="accink" cx="470" cy="60" r="10"/>
  <text class="sm" x="470" y="64" text-anchor="middle" fill="var(--bg-primary)">1</text>
  <text class="sm" x="488" y="58">One routine feeds both screens, so</text>
  <text class="sm" x="488" y="74">one fix clears both errors.</text>
</svg>
