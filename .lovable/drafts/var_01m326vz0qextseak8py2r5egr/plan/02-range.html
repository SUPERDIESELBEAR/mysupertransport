<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: var(--fg-secondary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .fillq { fill: var(--bg-muted); }
    .acc { fill: var(--bg-accent-translucent); stroke: var(--fg-accent); stroke-width: 1; rx: 8; }
    .accink { fill: var(--fg-accent); font-size: 12px; font-family: var(--font-sans); }
  </style>

  <!-- timeline rail -->
  <line x1="40" y1="120" x2="600" y2="120" stroke="var(--border-translucent)" stroke-width="1"/>
  <line x1="300" y1="70" x2="300" y2="230" stroke="var(--fg-secondary)" stroke-width="1"/>
  <text class="sm" x="300" y="62" text-anchor="middle" style="paint-order:stroke;stroke:var(--bg-primary);stroke-width:4px">today</text>

  <!-- past stretch (exists) -->
  <rect class="fillq" x="90" y="100" width="180" height="40" rx="8"/>
  <rect class="box" x="90" y="100" width="180" height="40"/>
  <text class="lbl" x="180" y="118" text-anchor="middle">Sep 14 – Sep 18</text>
  <text class="sm" x="180" y="134" text-anchor="middle">Home Time · counted</text>

  <!-- future stretch (new) -->
  <rect class="acc" x="330" y="100" width="200" height="40"/>
  <text class="lbl" x="430" y="118" text-anchor="middle">Sep 28 – Oct 2</text>
  <text class="accink" x="430" y="134" text-anchor="middle">Vacation · Planned</text>

  <!-- zones -->
  <rect class="zone" x="40" y="80" width="250" height="80"/>
  <text class="sm" x="48" y="176">already works</text>
  <rect class="zone" x="310" y="80" width="250" height="80"/>
  <text class="accink" x="318" y="176">new: future days allowed</text>

  <!-- ledger -->
  <circle cx="52" cy="212" r="9" fill="var(--fg-accent)"/>
  <text x="52" y="216" text-anchor="middle" font-size="11" fill="var(--bg-primary)" style="font-family:var(--font-sans)">1</text>
  <text class="sm" x="70" y="216">A future-only range never changes today's live board.</text>

  <circle cx="52" cy="244" r="9" fill="var(--fg-accent)"/>
  <text x="52" y="248" text-anchor="middle" font-size="11" fill="var(--bg-primary)" style="font-family:var(--font-sans)">2</text>
  <text class="sm" x="70" y="248">Planned days are totalled apart from days already off the road.</text>

  <circle cx="52" cy="276" r="9" fill="var(--fg-accent)"/>
  <text x="52" y="280" text-anchor="middle" font-size="11" fill="var(--bg-primary)" style="font-family:var(--font-sans)">3</text>
  <text class="sm" x="70" y="280">One reason and one note cover the whole stretch — one entry, not five.</text>
</svg>
