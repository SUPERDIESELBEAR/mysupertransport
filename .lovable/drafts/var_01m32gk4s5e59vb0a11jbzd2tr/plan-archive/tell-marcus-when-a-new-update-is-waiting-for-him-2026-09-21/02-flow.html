<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flow from a build to staff, with the new owner alert">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: var(--fg-secondary); }
    .bx { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .ac { fill: var(--bg-accent-translucent); stroke: var(--fg-accent); stroke-width: 1; }
    .w { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ch" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="8" y="40" width="130" height="52" rx="8"/>
  <text class="lbl" x="73" y="70" text-anchor="middle">Build ships</text>
  <text class="note" x="73" y="86" text-anchor="middle">staff-visible change</text>

  <line class="w" x1="140" y1="66" x2="184" y2="66" marker-end="url(#ch)"/>

  <rect class="bx" x="188" y="40" width="150" height="52" rx="8"/>
  <text class="lbl" x="263" y="63" text-anchor="middle">Draft announcement</text>
  <text class="note" x="263" y="80" text-anchor="middle">pending, nothing sent</text>

  <line class="w" x1="340" y1="66" x2="384" y2="66" marker-end="url(#ch)"/>

  <rect class="ac" x="388" y="40" width="160" height="52" rx="8"/>
  <text class="lbl" x="468" y="63" text-anchor="middle">Marcus is alerted</text>
  <text class="note" x="468" y="80" text-anchor="middle">bell + queue count (new)</text>

  <line class="w" x1="468" y1="94" x2="468" y2="132" marker-end="url(#ch)"/>

  <rect class="bx" x="388" y="136" width="160" height="52" rx="8"/>
  <text class="lbl" x="468" y="159" text-anchor="middle">He reviews</text>
  <text class="note" x="468" y="176" text-anchor="middle">approve · edit · deny</text>

  <line class="w" x1="386" y1="162" x2="342" y2="162" marker-end="url(#ch)"/>

  <rect class="bx" x="188" y="136" width="150" height="52" rx="8"/>
  <text class="lbl" x="263" y="159" text-anchor="middle">Staff see it</text>
  <text class="note" x="263" y="176" text-anchor="middle">pop-up · bell · email</text>

  <rect class="zone" x="176" y="24" width="384" height="84" rx="8"/>
  <text class="note" x="184" y="20">owner only until approved</text>

  <circle cx="576" cy="52" r="10" fill="var(--bg-accent)"/>
  <text x="576" y="56" text-anchor="middle" style="font-size:12px; fill: var(--fg-emphasis)">1</text>
  <text class="note" x="556" y="86" text-anchor="end">1 = the only new step</text>
</svg>
