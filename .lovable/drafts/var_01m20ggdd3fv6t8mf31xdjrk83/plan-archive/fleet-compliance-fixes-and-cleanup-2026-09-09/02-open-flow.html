<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open button behaviour, today versus proposed">
<style>
 text{font-family:var(--font-sans);fill:hsl(var(--foreground))}
 .lbl{font-size:14px;font-weight:480}
 .sm{font-size:12px;fill:hsl(var(--muted-foreground))}
 .tag{font-size:12px;fill:hsl(var(--border))}
 .bx{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}
 .zone{fill:none;stroke:hsl(var(--border));stroke-width:1;stroke-dasharray:4 3}
 .w{stroke:hsl(var(--muted-foreground));stroke-width:1;fill:none}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="hsl(var(--muted-foreground))"/>
</marker>
</defs>

<rect class="zone" x="8" y="8" width="624" height="120" rx="8"/>
<text class="tag" x="20" y="26">today</text>

<rect class="bx" x="24" y="44" width="150" height="52" rx="8"/>
<text class="lbl" x="99" y="68" text-anchor="middle">Alert row</text>
<text class="sm" x="99" y="86" text-anchor="middle">Open →</text>

<line class="w" x1="176" y1="70" x2="234" y2="70" marker-end="url(#a)"/>

<rect class="bx" x="236" y="44" width="180" height="52" rx="8"/>
<text class="lbl" x="326" y="68" text-anchor="middle">Application drawer</text>
<text class="sm" x="326" y="86" text-anchor="middle">CDL, or everything else</text>

<line class="w" x1="418" y1="70" x2="466" y2="70" marker-end="url(#a)"/>

<rect x="468" y="44" width="148" height="52" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
<text class="lbl" x="542" y="68" text-anchor="middle">Med Cert date box</text>
<text class="sm" x="542" y="86" text-anchor="middle">calendar pops open</text>

<rect class="zone" x="8" y="148" width="624" height="144" rx="8"/>
<text class="tag" x="20" y="166">proposed</text>

<rect class="bx" x="24" y="184" width="150" height="52" rx="8"/>
<text class="lbl" x="99" y="208" text-anchor="middle">Alert row</text>
<text class="sm" x="99" y="226" text-anchor="middle">Open / Upload</text>

<line class="w" x1="176" y1="210" x2="234" y2="196" marker-end="url(#a)"/>
<line class="w" x1="176" y1="210" x2="234" y2="256" marker-end="url(#a)"/>

<rect x="236" y="170" width="200" height="52" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent))"/>
<text class="lbl" x="336" y="194" text-anchor="middle" fill="hsl(var(--accent-foreground))">File on record</text>
<text x="336" y="212" text-anchor="middle" font-size="12" fill="hsl(var(--accent-foreground))">opens in the document viewer</text>

<rect class="bx" x="236" y="232" width="200" height="52" rx="8"/>
<text class="lbl" x="336" y="256" text-anchor="middle">No file yet</text>
<text class="sm" x="336" y="274" text-anchor="middle">goes to upload</text>
</svg>
