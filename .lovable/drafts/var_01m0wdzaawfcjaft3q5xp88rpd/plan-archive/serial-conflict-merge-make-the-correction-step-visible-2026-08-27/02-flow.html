<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" style="font-family: var(--font-sans)">
  <style>
    .l { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .n { fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .b { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .w { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="b" x="8" y="40" width="180" height="90" rx="8"/>
  <text class="l" x="24" y="66">Conflict card</text>
  <text class="n" x="24" y="86">two look-alike serials</text>
  <rect x="24" y="98" width="148" height="20" rx="10" fill="hsl(var(--primary))"/>
  <text x="98" y="112" text-anchor="middle" font-size="12" fill="hsl(var(--primary-foreground))">Keep this record</text>

  <line class="w" x1="188" y1="85" x2="238" y2="85" marker-end="url(#a)"/>

  <rect class="b" x="238" y="20" width="230" height="150" rx="8" stroke="hsl(var(--accent))"/>
  <text class="l" x="254" y="46">Confirmation dialog</text>
  <text class="n" x="254" y="66">Which number is right?</text>
  <circle cx="260" cy="84" r="5" class="b"/><text class="n" x="274" y="88">ABED32KG018536</text>
  <circle cx="260" cy="106" r="5" class="b"/><text class="n" x="274" y="110">ABED32KGO18536</text>
  <circle cx="260" cy="128" r="5" fill="hsl(var(--accent))"/><text class="n" x="274" y="132">Neither — type the correct number</text>
  <rect x="254" y="144" width="120" height="16" rx="8" fill="hsl(var(--muted))"/>

  <line class="w" x1="468" y1="95" x2="512" y2="95" marker-end="url(#a)"/>

  <rect class="b" x="512" y="40" width="120" height="110" rx="8"/>
  <text class="l" x="528" y="66">Written to</text>
  <text class="n" x="528" y="88">inventory</text>
  <text class="n" x="528" y="106">onboarding record</text>
  <text class="n" x="528" y="124">audit log</text>

  <text class="n" x="8" y="200">Only the card wording changes. The dialog and the write path already work as shown.</text>
</svg>
