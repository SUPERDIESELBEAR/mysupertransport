<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans);">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 12px; fill: hsl(var(--foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="ch" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="8" y="120" width="130" height="52" rx="8"/>
  <text class="lbl" x="73" y="142" text-anchor="middle">Serial typed</text>
  <text class="mono" x="73" y="160" text-anchor="middle">AABL36UGO24945</text>

  <line class="wire" x1="138" y1="146" x2="182" y2="146" marker-end="url(#ch)"/>

  <rect class="bx" x="186" y="112" width="140" height="68" rx="8"/>
  <text class="lbl" x="256" y="136" text-anchor="middle">Canonical form</text>
  <text class="sm" x="256" y="153" text-anchor="middle">O→0  I→1  L→1  S→5</text>
  <text class="mono" x="256" y="170" text-anchor="middle">AABL36UG024945</text>

  <line class="wire" x1="326" y1="132" x2="372" y2="82" marker-end="url(#ch)"/>
  <line class="wire" x1="326" y1="160" x2="372" y2="212" marker-end="url(#ch)"/>

  <rect x="376" y="48" width="250" height="66" rx="8" fill="none" stroke="hsl(var(--accent))" stroke-width="1"/>
  <text class="lbl" x="392" y="72" fill="hsl(var(--accent-foreground))">Exact canonical match — blocked</text>
  <text class="sm" x="392" y="92" >Already assigned to James Onan</text>
  <text class="sm" x="392" y="106">Return it there before reassigning</text>

  <rect class="bx" x="376" y="180" width="250" height="66" rx="8"/>
  <text class="lbl" x="392" y="204">One character off — warning</text>
  <text class="sm" x="392" y="224">Close to AABL36UF380967 (Chrestman)</text>
  <text class="sm" x="392" y="238">Staff may continue deliberately</text>

  <circle cx="20" cy="270" r="9" fill="hsl(var(--accent))"/>
  <text x="20" y="274" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
  <text class="sm" x="38" y="274">Only the comparison is folded — the serial is stored exactly as typed.</text>
</svg>
