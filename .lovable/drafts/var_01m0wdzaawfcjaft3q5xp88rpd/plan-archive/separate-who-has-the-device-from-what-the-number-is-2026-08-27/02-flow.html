<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 12px; }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zn { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="8" y="20" width="180" height="72" rx="8"/>
  <text class="lbl" x="20" y="44">McMillan</text>
  <text class="mono" x="20" y="64" fill="hsl(var(--muted-foreground))">DC4<tspan fill="hsl(var(--accent-foreground))" font-weight="600">8</tspan>21077</text>
  <text class="sm" x="20" y="82">number is right</text>

  <rect class="bx" x="8" y="112" width="180" height="72" rx="8"/>
  <text class="lbl" x="20" y="136">Huddleston</text>
  <text class="mono" x="20" y="156" fill="hsl(var(--muted-foreground))">DC4<tspan fill="hsl(var(--accent-foreground))" font-weight="600">3</tspan>21077</text>
  <text class="sm" x="20" y="174">holder is right</text>

  <rect class="zn" x="228" y="8" width="200" height="200" rx="8"/>
  <text class="sm" x="240" y="28">confirm dialog</text>
  <rect class="bx" x="248" y="44" width="160" height="60" rx="8"/>
  <text class="lbl" x="262" y="68">1. Record stays</text>
  <text class="sm" x="262" y="90">Huddleston</text>
  <rect class="bx" x="248" y="122" width="160" height="66" rx="8"/>
  <text class="lbl" x="262" y="146">2. Correct serial</text>
  <text class="sm" x="262" y="168">McMillan's number</text>

  <path class="wire" d="M188 56 L246 74" marker-end="url(#ar)"/>
  <path class="wire" d="M188 148 L246 154" marker-end="url(#ar)"/>
  <path class="wire" d="M428 108 L488 108" marker-end="url(#ar)"/>

  <rect x="496" y="60" width="136" height="96" rx="8" fill="hsl(var(--accent))" stroke="none"/>
  <text class="lbl" x="510" y="88" fill="hsl(var(--accent-foreground))">Result</text>
  <text class="sm" x="510" y="110" fill="hsl(var(--accent-foreground))">Huddleston keeps</text>
  <text class="mono" x="510" y="130" fill="hsl(var(--accent-foreground))">DC4821077</text>
  <text class="sm" x="510" y="148" fill="hsl(var(--accent-foreground))">duplicate merged in</text>

  <circle cx="20" cy="238" r="9" fill="hsl(var(--accent))"/>
  <text x="20" y="242" font-size="11" text-anchor="middle" fill="hsl(var(--accent-foreground))">1</text>
  <text class="sm" x="38" y="242">The surviving record's serial is corrected during the merge, and the change is written to the audit log.</text>
  <circle cx="20" cy="266" r="9" fill="hsl(var(--accent))"/>
  <text x="20" y="270" font-size="11" text-anchor="middle" fill="hsl(var(--accent-foreground))">2</text>
  <text class="sm" x="38" y="270">A "Neither — type it" option covers the case where both records were mistyped.</text>
</svg>
