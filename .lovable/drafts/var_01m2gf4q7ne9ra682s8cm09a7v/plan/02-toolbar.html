<html><body style="margin:0">
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans)">
  <!-- Section header -->
  <rect x="8" y="8" width="624" height="44" rx="8" fill="none" stroke="var(--fg-secondary)" stroke-width="1"/>
  <text x="52" y="35" font-size="14" font-weight="480" fill="var(--fg-primary)">ELD</text>
  <text x="88" y="35" font-size="12" fill="var(--fg-secondary)">18 devices</text>
  <text x="624" y="35" font-size="12" fill="var(--fg-secondary)" text-anchor="end">4 Available · 12 Assigned · 2 Deactivated</text>
  <path d="M28 26 l6 6 l-6 6" fill="none" stroke="var(--fg-secondary)" stroke-width="1.5"/>

  <!-- Toolbar -->
  <rect x="8" y="60" width="624" height="52" rx="8" fill="none" stroke="var(--fg-secondary)" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="20" y="72" width="300" height="28" rx="6" fill="var(--bg-muted)"/>
  <text x="32" y="90" font-size="12" fill="var(--fg-secondary)">Search ELD — serial, driver, unit #...</text>
  <!-- Sort select, the accent -->
  <rect x="332" y="72" width="160" height="28" rx="6" fill="var(--bg-accent-translucent)" stroke="var(--fg-accent)" stroke-width="1"/>
  <text x="344" y="90" font-size="12" fill="var(--fg-accent)">Sort: Unit number</text>
  <path d="M474 80 l5 6 l5 -6" fill="none" stroke="var(--fg-accent)" stroke-width="1.5"/>
  <rect x="504" y="72" width="120" height="28" rx="6" fill="var(--bg-accent)"/>
  <text x="564" y="90" font-size="12" fill="var(--fg-emphasis)" text-anchor="middle">+ Add ELD</text>

  <!-- Rows sorted by unit -->
  <g>
    <rect x="8" y="120" width="624" height="34" rx="6" fill="none" stroke="var(--border-translucent)"/>
    <text x="24" y="141" font-size="12" fill="var(--fg-primary)">Unit 214 · Kevin Foy</text>
    <text x="616" y="141" font-size="12" fill="var(--fg-secondary)" text-anchor="end">SN 88231</text>
    <rect x="8" y="158" width="624" height="34" rx="6" fill="none" stroke="var(--border-translucent)"/>
    <text x="24" y="179" font-size="12" fill="var(--fg-primary)">Unit 243 · Jane Doe</text>
    <text x="616" y="179" font-size="12" fill="var(--fg-secondary)" text-anchor="end">SN 90117</text>
    <rect x="8" y="196" width="624" height="34" rx="6" fill="none" stroke="var(--border-translucent)"/>
    <text x="24" y="217" font-size="12" fill="var(--fg-primary)">Unit 257 · Alex Cruz</text>
    <text x="616" y="217" font-size="12" fill="var(--fg-secondary)" text-anchor="end">SN 91044</text>
  </g>

  <!-- Ledger -->
  <circle cx="20" cy="266" r="8" fill="var(--fg-accent)"/>
  <text x="20" y="270" font-size="11" fill="var(--fg-emphasis)" text-anchor="middle">1</text>
  <text x="36" y="270" font-size="12" fill="var(--fg-secondary)">Sort chosen here applies only to this section, in card or table view</text>
  <text x="36" y="288" font-size="12" fill="var(--fg-secondary)">Fuel cards sort inside their Assigned / Unassigned / Lost / Deactivated groups</text>
</svg>
</body></html>
