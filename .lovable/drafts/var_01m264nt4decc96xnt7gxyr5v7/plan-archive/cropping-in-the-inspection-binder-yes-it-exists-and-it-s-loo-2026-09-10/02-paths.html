<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Viewer follows the saved link and succeeds; editor re-derives the location and fails">
<style>
  .t { font-family: var(--font-sans); fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
  .s { font-family: var(--font-sans); fill: hsl(var(--muted-foreground)); font-size: 12px; }
  .m { font-family: var(--font-mono); fill: hsl(var(--muted-foreground)); font-size: 11px; }
  .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
  .ac { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  .w { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  .wa { stroke: hsl(var(--accent)); stroke-width: 1; fill: none; }
</style>
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  </marker>
  <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7" fill="none" stroke="hsl(var(--accent))" stroke-width="1"/>
  </marker>
</defs>

<rect class="bx" x="8" y="20" width="180" height="64" rx="8"/>
<text class="t" x="24" y="44">Binder document row</text>
<text class="m" x="24" y="64">fleet-documents/driver/…jpeg</text>

<rect class="bx" x="250" y="8" width="150" height="52" rx="8"/>
<text class="t" x="266" y="30">Viewer</text>
<text class="s" x="266" y="48">follows saved link</text>

<rect class="ac" x="250" y="98" width="150" height="52" rx="8"/>
<text class="t" x="266" y="120">Editor (pencil)</text>
<text class="s" x="266" y="138">guesses from path</text>

<path class="w" d="M188 44 L250 34" marker-end="url(#a)"/>
<path class="wa" d="M188 60 L250 118" marker-end="url(#b)"/>

<rect class="bx" x="452" y="8" width="180" height="52" rx="8"/>
<text class="t" x="468" y="30">inspection area</text>
<text class="s" x="468" y="48">file is here — opens</text>

<rect class="ac" x="452" y="98" width="180" height="52" rx="8"/>
<text class="t" x="468" y="120">fleet area</text>
<text class="s" x="468" y="138">nothing here — error</text>

<path class="w" d="M400 34 L452 34" marker-end="url(#a)"/>
<path class="wa" d="M400 124 L452 124" marker-end="url(#b)"/>

<circle cx="24" cy="200" r="9" fill="hsl(var(--accent))"/>
<text x="24" y="204" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
<text class="s" x="44" y="204">The fix: the editor reads the same saved link the viewer uses, instead of guessing.</text>

<circle cx="24" cy="234" r="9" fill="hsl(var(--accent))"/>
<text x="24" y="238" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="hsl(var(--accent-foreground))">2</text>
<text class="s" x="44" y="238">When there is no link, the leading area word is stripped off the path before looking.</text>

<circle cx="24" cy="268" r="9" fill="hsl(var(--accent))"/>
<text x="24" y="272" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="hsl(var(--accent-foreground))">3</text>
<text class="s" x="44" y="272">87 affected documents across the fleet are fixed by the same change — no data edits.</text>
</svg>
