<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bx" x="16" y="40" width="150" height="56" rx="8"/>
  <text class="lbl" x="91" y="64" text-anchor="middle">Binder upload</text>
  <text class="sm" x="91" y="82" text-anchor="middle">saves location + link</text>

  <rect class="bx" x="16" y="150" width="150" height="56" rx="8"/>
  <text class="lbl" x="91" y="174" text-anchor="middle">Vehicle Hub upload</text>
  <text class="sm" x="91" y="192" text-anchor="middle">saves location only</text>

  <rect class="bx" x="245" y="95" width="150" height="56" rx="8"/>
  <text class="lbl" x="320" y="119" text-anchor="middle">Binder record</text>
  <text class="sm" x="320" y="137" text-anchor="middle">location · link · date</text>

  <path class="wire" d="M166 68 L245 112" marker-end="url(#a)"/>
  <path class="wire" d="M166 178 L245 134" marker-end="url(#a)"/>

  <rect class="bx" x="470" y="34" width="154" height="56" rx="8"/>
  <text class="lbl" x="547" y="58" text-anchor="middle">Today: reads link</text>
  <text class="sm" x="547" y="76" text-anchor="middle">blank link = "No file"</text>

  <rect x="470" y="156" width="154" height="56" rx="8" fill="hsl(var(--accent))" stroke="none"/>
  <text class="lbl" x="547" y="180" text-anchor="middle" fill="hsl(var(--accent-foreground))">Fix: reads location</text>
  <text x="547" y="198" text-anchor="middle" font-size="12" fill="hsl(var(--accent-foreground))">link made on opening</text>

  <path class="wire" d="M395 112 L470 74" marker-end="url(#a)"/>
  <path class="wire" d="M395 134 L470 178" marker-end="url(#a)"/>

  <circle cx="26" cy="252" r="9" fill="hsl(var(--accent))"/>
  <text x="26" y="256" text-anchor="middle" font-size="11" fill="hsl(var(--accent-foreground))">1</text>
  <text class="sm" x="44" y="256">Both doors already write the same binder record — only the reading rule changes.</text>
