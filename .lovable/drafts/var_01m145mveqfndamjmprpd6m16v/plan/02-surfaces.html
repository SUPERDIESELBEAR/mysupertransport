<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .mut { fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
    .zone { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1.5; rx: 8; }
    .bar { fill: hsl(var(--muted)); rx: 3; }
  </style>

  <!-- Online form -->
  <rect class="box" x="20" y="30" width="180" height="220" rx="8"/>
  <text x="110" y="50" text-anchor="middle" font-size="14" font-weight="480">Online form</text>
  <text x="110" y="66" text-anchor="middle" font-size="12" class="mut">/apply</text>
  <rect class="bar" x="70" y="80" width="80" height="26"/>
  <text x="110" y="97" text-anchor="middle" font-size="11" class="mut">logo</text>
  <rect class="bar" x="40" y="118" width="140" height="8"/>
  <rect class="bar" x="40" y="132" width="120" height="8"/>
  <rect class="bar" x="40" y="146" width="140" height="8"/>
  <rect class="bar" x="40" y="160" width="100" height="8"/>
  <text x="110" y="232" text-anchor="middle" font-size="12" class="mut">logo today · no name/address</text>

  <!-- Standalone disclosure PDFs -->
  <rect class="acc" x="230" y="30" width="180" height="220" rx="8"/>
  <text x="320" y="50" text-anchor="middle" font-size="14" font-weight="480">4 disclosure PDFs</text>
  <text x="320" y="66" text-anchor="middle" font-size="12" class="mut">FCRA · PSP · 40.25(j) · 382.601</text>
  <rect class="bar" x="250" y="80" width="140" height="10"/>
  <text x="320" y="90" text-anchor="middle" font-size="11" class="mut">"SUPERTRANSPORT" text only</text>
  <rect class="bar" x="250" y="118" width="140" height="8"/>
  <rect class="bar" x="250" y="132" width="120" height="8"/>
  <rect class="bar" x="250" y="146" width="140" height="8"/>
  <rect class="bar" x="250" y="160" width="100" height="8"/>
  <text x="320" y="232" text-anchor="middle" font-size="12" class="mut">no logo · no address block</text>

  <!-- Printed application snapshot -->
  <rect class="acc" x="440" y="30" width="180" height="220" rx="8"/>
  <text x="530" y="50" text-anchor="middle" font-size="14" font-weight="480">Printed application</text>
  <text x="530" y="66" text-anchor="middle" font-size="12" class="mut">staff snapshot print</text>
  <rect class="bar" x="460" y="80" width="140" height="8"/>
  <rect class="bar" x="460" y="94" width="120" height="8"/>
  <rect class="bar" x="460" y="108" width="140" height="8"/>
  <rect class="bar" x="460" y="122" width="100" height="8"/>
  <rect class="bar" x="460" y="136" width="140" height="8"/>
  <text x="530" y="232" text-anchor="middle" font-size="12" class="mut">no letterhead at all</text>

  <text x="320" y="284" text-anchor="middle" font-size="12" class="mut">gold outline = candidate surfaces for a shared company letterhead</text>
</svg>
