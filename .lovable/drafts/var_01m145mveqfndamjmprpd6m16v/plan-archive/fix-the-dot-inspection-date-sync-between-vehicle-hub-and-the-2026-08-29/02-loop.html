<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
<style>
text{font-family:var(--font-sans);fill:hsl(var(--foreground))}
.lbl{font-size:14px;font-weight:480}
.note{font-size:12px;fill:hsl(var(--muted-foreground))}
.box{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}
.wire{stroke:hsl(var(--muted-foreground));stroke-width:1;fill:none}
.hot{stroke:hsl(var(--accent));stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:hsl(var(--background));stroke-width:4px}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))"/></marker>
<marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--accent))"/></marker>
</defs>

<rect class="box" x="40" y="60" width="200" height="70" rx="8"/>
<text class="lbl" x="140" y="88" text-anchor="middle">Vehicle Hub record</text>
<text class="note" x="140" y="110" text-anchor="middle">inspection_date + next due</text>

<rect class="box" x="400" y="60" width="200" height="70" rx="8"/>
<text class="lbl" x="500" y="88" text-anchor="middle">Binder document</text>
<text class="note" x="500" y="110" text-anchor="middle">one date field</text>

<path class="wire" d="M240 82 L396 82" marker-end="url(#a)"/>
<text class="note halo" x="318" y="74" text-anchor="middle">writes NEXT DUE date</text>

<path class="hot" d="M400 116 L244 116" marker-end="url(#b)"/>
<text class="note halo" x="318" y="136" text-anchor="middle">writes it back as INSPECTION date</text>

<path class="wire" d="M500 134 C 500 190, 140 190, 140 136" marker-end="url(#a)"/>
<text class="note halo" x="320" y="186" text-anchor="middle">screen load: binder overwritten from Vehicle Hub</text>

<rect class="box" x="40" y="222" width="560" height="52" rx="8" stroke-dasharray="4 3" stroke="hsl(var(--border))"/>
<text class="note" x="60" y="244">Guard flag mismatch: the outbound path raises one flag, the return path checks another —</text>
<text class="note" x="60" y="262">so the return write is never suppressed and can land on top of the value you just saved.</text>
</svg>
