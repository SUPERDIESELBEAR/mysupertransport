<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }

    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }

  <defs>
    <marker id="ch" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">

  <text class="sub" x="250" y="201">stay in Denied for now &#8212; your call, one click each</text>
  <text class="sub" x="250" y="216">named on the next page</text>

  <path class="wire" d="M158 123 L234 71" marker-end="url(#ch)"/>
  <path class="wire" d="M158 123 L234 129" marker-end="url(#ch)"/>
  <path class="wire" d="M158 127 L234 190" marker-end="url(#ch)"/>
