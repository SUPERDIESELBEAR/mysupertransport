<!DOCTYPE html>
<html>
<head>
<style>
  svg { font-family: var(--font-sans); }
  .lbl { font-size: 14px; font-weight: 480; fill: var(--fg-primary); }
  .note { font-size: 12px; fill: var(--fg-secondary); }
  .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
  .acc { fill: var(--bg-accent-translucent); stroke: none; rx: 8; }
  .accink { font-size: 12px; fill: var(--fg-accent); }
  .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
  .tag { font-size: 12px; fill: var(--border-translucent); }
</style>
</head>
<body>
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--fg-secondary)"/>
    </marker>
  </defs>

  <text class="tag" x="8" y="18">today</text>
  <rect class="zone" x="4" y="26" width="632" height="96"/>
  <rect class="box" x="20" y="48" width="150" height="52"/>
  <text class="lbl" x="95" y="70" text-anchor="middle">Application</text>
  <text class="note" x="95" y="88" text-anchor="middle">"checks in progress"</text>
  <line x1="172" y1="74" x2="238" y2="74" stroke="var(--fg-secondary)" marker-end="url(#a)"/>
  <rect class="box" x="240" y="48" width="160" height="52"/>
  <text class="lbl" x="320" y="70" text-anchor="middle">No request rows</text>
  <text class="note" x="320" y="88" text-anchor="middle">deleted, no trail</text>
  <rect class="acc" x="430" y="48" width="190" height="52"/>
  <text class="accink" x="525" y="72" text-anchor="middle">unrecoverable —</text>
  <text class="accink" x="525" y="89" text-anchor="middle">nothing left to restore</text>

  <text class="tag" x="8" y="158">after this work</text>
  <rect class="zone" x="4" y="166" width="632" height="126"/>
  <rect class="box" x="20" y="190" width="150" height="80"/>
  <text class="lbl" x="95" y="220" text-anchor="middle">Application</text>
  <text class="note" x="95" y="240" text-anchor="middle">3 employers on file</text>
  <line x1="172" y1="230" x2="238" y2="230" stroke="var(--fg-secondary)" marker-end="url(#a)"/>
  <rect class="box" x="240" y="190" width="160" height="80"/>
  <text class="lbl" x="320" y="216" text-anchor="middle">3 new requests</text>
  <text class="note" x="320" y="236" text-anchor="middle">Schneider · Focus HR</text>
  <text class="note" x="320" y="253" text-anchor="middle">Falcon Jet · ready to send</text>
  <line x1="402" y1="230" x2="428" y2="230" stroke="var(--fg-secondary)" marker-end="url(#a)"/>
  <rect class="box" x="430" y="190" width="190" height="80"/>
  <text class="lbl" x="525" y="214" text-anchor="middle">Logged and kept</text>
  <text class="note" x="525" y="234" text-anchor="middle">who sent · who withdrew</text>
  <text class="note" x="525" y="251" text-anchor="middle">status mismatch flagged</text>
</svg>
</body>
</html>
