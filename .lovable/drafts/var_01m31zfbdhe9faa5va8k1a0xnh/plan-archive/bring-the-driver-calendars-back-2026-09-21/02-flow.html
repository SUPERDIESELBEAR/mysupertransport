<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: var(--fg-secondary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: var(--fg-accent); stroke-width: 1; rx: 8; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--fg-secondary)"/>
    </marker>
  </defs>

  <text class="note" x="0" y="14">today</text>
  <rect class="box" x="0" y="26" width="150" height="54"/>
  <text class="lbl" x="75" y="50" text-anchor="middle">Calendar asks for</text>
  <text class="lbl" x="75" y="68" text-anchor="middle">day + reason</text>
  <line class="wire" x1="150" y1="53" x2="222" y2="53" marker-end="url(#a)"/>
  <rect class="box" x="224" y="26" width="150" height="54"/>
  <text class="lbl" x="299" y="50" text-anchor="middle">Reason field</text>
  <text class="lbl" x="299" y="68" text-anchor="middle">not there yet</text>
  <line class="wire" x1="374" y1="53" x2="446" y2="53" marker-end="url(#a)"/>
  <rect class="box" x="448" y="26" width="180" height="54"/>
  <text class="lbl" x="538" y="50" text-anchor="middle">Whole request fails</text>
  <text class="note" x="538" y="68" text-anchor="middle">every day shows "?"</text>

  <text class="note" x="0" y="130">after this plan</text>
  <rect class="acc" x="0" y="142" width="150" height="54"/>
  <text class="lbl" x="75" y="166" text-anchor="middle">Ask for day + reason</text>
  <text class="note" x="75" y="184" text-anchor="middle">retry without reason</text>
  <line class="wire" x1="150" y1="169" x2="222" y2="169" marker-end="url(#a)"/>
  <rect class="box" x="224" y="142" width="150" height="54"/>
  <text class="lbl" x="299" y="166" text-anchor="middle">Days always load</text>
  <text class="note" x="299" y="184" text-anchor="middle">colours restored</text>
  <line class="wire" x1="374" y1="169" x2="446" y2="169" marker-end="url(#a)"/>
  <rect class="box" x="448" y="142" width="180" height="54"/>
  <text class="lbl" x="538" y="162" text-anchor="middle">Reasons appear</text>
  <text class="note" x="538" y="180" text-anchor="middle">when draft is accepted</text>

  <text class="note" x="0" y="232">Same fallback for the Absence Log panel and for saving a day or a date range.</text>
</svg>
